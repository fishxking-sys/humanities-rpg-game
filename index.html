<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'PingFang HK', 'Microsoft JhengHei', sans-serif; background-color: #1a202c; color: white; touch-action: manipulation; }
    .screen { display: none; min-height: 100vh; flex-direction: column; }
    .active-screen { display: flex; }
    .option-btn { transition: all 0.2s ease; border: 4px solid transparent; }
    .option-btn.selected { border-color: #fbbf24; box-shadow: 0 0 15px #fbbf24; transform: scale(1.02); }
    
    /* 動畫特效 */
    @keyframes shake {
      0% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      50% { transform: translateX(10px); }
      75% { transform: translateX(-10px); }
      100% { transform: translateX(0); }
    }
    .shake-animation { animation: shake 0.4s ease-in-out; }
    
    @keyframes flash-red {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(0.5) sepia(1) hue-rotate(-50deg) saturate(5); }
    }
    .flash-red-animation { animation: flash-red 0.5s ease-in-out; }
    
    @keyframes flash-green {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.5) sepia(1) hue-rotate(80deg) saturate(3); }
    }
    .flash-green-animation { animation: flash-green 0.5s ease-in-out; }

    ::-webkit-scrollbar { width: 0px; background: transparent; }
  </style>
</head>

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";

    // 使用您提供的 Firebase 配置
    const firebaseConfig = {
      apiKey: "AIzaSyBJWPQVmBfoM4_gbD_6HALmIinqY7yImpQ",
      authDomain: "gen-lang-client-0031507703.firebaseapp.com",
      projectId: "gen-lang-client-0031507703",
      storageBucket: "gen-lang-client-0031507703.firebasestorage.app",
      messagingSenderId: "200633310886",
      appId: "1:200633310886:web:fa2eda9447e491c1d29e67",
      measurementId: "G-LNNFZKYCT4"
    };

    let db;
    try {
      const app = initializeApp(firebaseConfig);
      const analytics = getAnalytics(app);
      db = getFirestore(app);
      console.log("Firebase 初始化成功");
    } catch (error) {
      console.warn("Firebase 初始化錯誤:", error);
    }

    // 上傳成績函數
    window.uploadGameScore = async function(name, score, correct, totalTime) {
      if (!db) return;
      try {
        const accuracy = correct / 30; // 30為總題數
        await addDoc(collection(db, "leaderboard"), {
          name: name,
          score: score,
          correctCount: correct,
          accuracy: accuracy,
          timeTaken: totalTime,
          createdAt: new Date()
        });
        window.fetchGameLeaderboard();
      } catch (e) {
        console.error("上傳失敗:", e);
        document.getElementById('leaderboard-list').innerHTML = `<p class="text-red-400 text-center">上傳成績失敗，請檢查資料庫規則設定。</p>`;
      }
    };

    // 讀取排行榜函數
    window.fetchGameLeaderboard = async function() {
      if (!db) return;
      const listContainer = document.getElementById('leaderboard-list');
      try {
        const q = query(collection(db, "leaderboard"), orderBy("accuracy", "desc"), orderBy("timeTaken", "asc"), limit(10));
        const querySnapshot = await getDocs(q);
        
        listContainer.innerHTML = "";
        if(querySnapshot.empty) {
          listContainer.innerHTML = `<p class="text-gray-400 text-center">暫無紀錄，成為第一個上榜的人吧！</p>`;
          return;
        }

        let rank = 1;
        querySnapshot.forEach((doc) => {
          const data = doc.data();
          const mins = Math.floor(data.timeTaken / 60);
          const secs = data.timeTaken % 60;
          
          let badge = `${rank}.`;
          if(rank === 1) badge = "🥇"; else if(rank === 2) badge = "🥈"; else if(rank === 3) badge = "🥉";

          const row = document.createElement('div');
          row.className = "flex justify-between items-center bg-gray-800 p-3 rounded-lg text-lg mb-2 border border-gray-700";
          row.innerHTML = `
            <div class="flex items-center space-x-3">
              <span class="w-8 font-bold text-center text-xl">${badge}</span>
              <span class="font-bold text-white">${data.name}</span>
            </div>
            <div class="text-right">
              <span class="text-yellow-400 font-bold">${data.correctCount}題</span> 
              <span class="text-sm text-gray-400 ml-2">(${mins}分${secs}秒)</span>
            </div>`;
          listContainer.appendChild(row);
          rank++;
        });
      } catch (e) {
        console.error("讀取排行榜失敗:", e);
        listContainer.innerHTML = `<p class="text-red-400 text-center">無法載入排行榜（可能是 Firestore 規則設定不允許）</p>`;
      }
    };
  </script>

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let isMuted = false;
    
    function playTone(freq, type, duration, vol=0.1) {
      if (isMuted || audioCtx.state === 'suspended') return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }
    
    const sounds = {
      correct: () => { playTone(600, 'sine', 0.1); setTimeout(() => playTone(800, 'sine', 0.2), 100); },

      btnMute: document.getElementById('btn-mute'),
      btnConfirm: document.getElementById('btn-confirm'),
      btnCancel: document.getElementById('btn-cancel'),
      btnRestart: document.getElementById('btn-restart'),
      options: document.querySelectorAll('.option-btn'),
      qText: document.getElementById('question-text'),
      pHpBar: document.getElementById('player-hp-bar'),
      pHpText: document.getElementById('player-hp-text'),
      pSprite: document.getElementById('player-sprite'),
      pName: document.getElementById('player-name-display'),
      mHpBar: document.getElementById('monster-hp-bar'),
      mHpText: document.getElementById('monster-hp-text'),
      mSprite: document.getElementById('monster-sprite'),
      score: document.getElementById('score'),
      combo: document.getElementById('combo')
    };

    ui.nameInput.addEventListener('input', checkStartConditions);
    ui.charSelects.forEach(btn => {
      btn.addEventListener('click', () => {
        ui.charSelects.forEach(b => b.classList.remove('border-yellow-400', 'bg-gray-700'));
        btn.classList.add('border-yellow-400', 'bg-gray-700');
        player.char = btn.dataset.char;
        checkStartConditions();
      });
    });

    function checkStartConditions() {
      if(ui.nameInput.value.trim() !== "" && player.char !== "") ui.btnStart.disabled = false;
      else ui.btnStart.disabled = true;
    }

    ui.btnStart.addEventListener('click', initGame);
    ui.btnRestart.addEventListener('click', () => {
      screens.end.classList.remove('active-screen');
      screens.start.classList.add('active-screen');
    });

    ui.btnFullscreen.addEventListener('click', () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(err => console.log(err));
      else document.exitFullscreen();
    });

    ui.btnMute.addEventListener('click', () => {
      isMuted = !isMuted;
      ui.btnMute.textContent = isMuted ? "🔇" : "🔊";
    });

    function initGame() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      player.name = ui.nameInput.value.trim();
      ui.pName.textContent = player.name;
      ui.pSprite.textContent = charEmojis[player.char];
      
      player.hp = 100; monster.hp = 100; monster.count = 0;
      state = { score: 0, combo: 0, questionIndex: 0, correctCount: 0, wrongCount: 0, selectedOption: null, questions: [] };
      
      state.questions = JSON.parse(JSON.stringify(allQuestions)).sort(() => Math.random() - 0.5);
      state.questions.forEach(q => {
        const correctText = q.options[q.ans];
        q.options.sort(() => Math.random() - 0.5);
        q.ans = q.options.indexOf(correctText);
      });

      timer.start = Date.now();
      updateUI();
      loadQuestion();
      
      screens.start.classList.remove('active-screen');
      screens.game.classList.add('active-screen');
    }

    function loadQuestion() {
      if (state.questionIndex >= state.questions.length) {
        endGame(true);
        return;
      }
      const q = state.questions[state.questionIndex];
      ui.qText.textContent = `第 ${state.questionIndex + 1}/30 題：${q.q}`;
      
      state.selectedOption = null;
      ui.btnConfirm.disabled = true;
      ui.btnCancel.disabled = true;

      ui.options.forEach((btn, idx) => {
        btn.textContent = q.options[idx];
        btn.classList.remove('selected');
        btn.onclick = () => selectOption(idx);
      });
    }

    function selectOption(index) {
      state.selectedOption = index;
      ui.options.forEach((btn, idx) => {
        if(idx === index) btn.classList.add('selected');
        else btn.classList.remove('selected');
      });
      ui.btnConfirm.disabled = false;
      ui.btnCancel.disabled = false;
    }

    ui.btnCancel.addEventListener('click', () => {
      state.selectedOption = null;
      ui.options.forEach(btn => btn.classList.remove('selected'));
      ui.btnConfirm.disabled = true;
      ui.btnCancel.disabled = true;
    });

    ui.btnConfirm.addEventListener('click', () => {
      if (state.selectedOption === null) return;
      checkAnswer();
    });

    function checkAnswer() {
      const q = state.questions[state.questionIndex];
      const isCorrect = (state.selectedOption === q.ans);
      
      ui.btnConfirm.disabled = true;
      ui.options.forEach(b => b.onclick = null);

      if (isCorrect) {
        state.correctCount++;
        state.combo++;
        let dmg = 20 + (state.combo * 5);
        state.score += 100 * state.combo;
        monster.hp -= dmg;
        
        sounds.correct();
        setTimeout(sounds.attack, 200);
        triggerAnimation(ui.pSprite, 'shake-animation');
        triggerAnimation(ui.mSprite, 'flash-red-animation');

        if (state.combo % 3 === 0) {
          player.hp = Math.min(player.maxHp, player.hp + 20);
          setTimeout(sounds.heal, 400);
          triggerAnimation(ui.pSprite, 'flash-green-animation');
        }

      } else {
        state.wrongCount++;
        state.combo = 0;
        player.hp -= 25;
        
        sounds.wrong();
        triggerAnimation(ui.mSprite, 'shake-animation');
        triggerAnimation(ui.pSprite, 'flash-red-animation');
      }

      updateUI();

      setTimeout(() => {
        if (player.hp <= 0) {
          endGame(false);
        } else if (monster.hp <= 0) {
          monster.count++;
          monster.hp = monster.maxHp;
          ui.mSprite.textContent = monstersList[monster.count % monstersList.length];
          updateUI();
          state.questionIndex++;
          loadQuestion();
        } else {
          state.questionIndex++;
          loadQuestion();
        }
      }, 1000);
    }

    function updateUI() {
      ui.pHpBar.style.width = Math.max(0, (player.hp / player.maxHp) * 100) + '%';
      ui.pHpText.textContent = `${Math.max(0, player.hp)}/${player.maxHp}`;
      
      ui.mHpBar.style.width = Math.max(0, (monster.hp / monster.maxHp) * 100) + '%';
      ui.mHpText.textContent = `${Math.max(0, Math.floor(monster.hp))}/${monster.maxHp}`;
      
      ui.score.textContent = state.score;
      ui.combo.textContent = state.combo;
    }

    function triggerAnimation(element, className) {
      element.classList.remove(className);
      void element.offsetWidth;
      element.classList.add(className);
    }

    function endGame(isWin) {
      timer.totalSeconds = Math.floor((Date.now() - timer.start) / 1000);
      screens.game.classList.remove('active-screen');
      screens.end.classList.add('active-screen');
      
      if (isWin || player.hp > 0) {
        document.getElementById('end-title').textContent = "戰鬥勝利！知識就是力量！";
        document.getElementById('end-title').classList.replace('text-red-500', 'text-yellow-400');
        sounds.win();
      } else {
        document.getElementById('end-title').textContent = "英雄倒下，請再接再厲！";
        document.getElementById('end-title').classList.replace('text-yellow-400', 'text-red-500');
      }

      const mins = Math.floor(timer.totalSeconds / 60);
      const secs = timer.totalSeconds % 60;

      document.getElementById('stat-name').textContent = player.name;
      document.getElementById('stat-score').textContent = state.score;
      document.getElementById('stat-correct').textContent = state.correctCount;
      document.getElementById('stat-wrong').textContent = state.wrongCount;
      document.getElementById('stat-monsters').textContent = monster.count;
      document.getElementById('stat-time').textContent = `${mins}分${secs}秒`;

      if (window.uploadGameScore) {
        window.uploadGameScore(player.name, state.score, state.correctCount, timer.totalSeconds);
      }
    }
  </script>
</body>
</html>
